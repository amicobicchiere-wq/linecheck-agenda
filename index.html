<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Agenda Linecheck 2026</title>

<style>
/* Stile AmicoBicchiere dalla presentazione: azzurro chiaro, titoli tondi maiuscoli blu notte, etichette blu inclinate, giallo solo per avvisi. Una colonna da telefono. */
:root{
  --bg:#EAF6FC;--surface:#FFFFFF;--title:#1F5A74;--ink:#21414F;--muted:#5A7584;--line:#CDE8F5;--blob:#C6E9F8;
  --accent:#069BD7;--accent-dark:#04668F;--accent-soft:#E1F3FB;--navy:#1F5A74;
  --past:#D64545;--past-soft:#FDECEC;--live:#1E9A5E;--live-soft:#E3F5EB;
  --soon:#FFC93C;--soon-soft:#FFF5D6;--done:#9DB0BA;
  --font-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Quicksand","Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:500;font-size:16px;line-height:1.45;position:relative;overflow-x:hidden;min-height:100%}
body::before{content:"";position:absolute;top:-150px;right:-130px;width:300px;height:300px;border-radius:50%;background:var(--blob);box-shadow:-14px 14px 0 -12px var(--navy);pointer-events:none}
body::after{content:"";position:absolute;top:640px;left:-170px;width:260px;height:260px;border-radius:50%;background:var(--blob);opacity:.7;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.logo{height:52px;width:auto;display:block}
h1{font-family:var(--font-display);font-weight:400;font-size:42px;line-height:.95;margin:0;color:var(--title);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.bar{display:inline-block;background:var(--navy);color:#fff;font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:15px;letter-spacing:.03em;padding:7px 14px;border-radius:8px;transform:rotate(-1deg)}
.sub{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.banner{font-size:14px;font-weight:600;padding:9px 12px;border-radius:10px;background:var(--soon-soft);border:2px solid var(--soon);color:var(--title)}
.banner:empty{display:none}

.now{background:var(--navy);color:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--navy)}
.now.soon{background:var(--soon);color:var(--title);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--soon)}
.now.live{background:var(--live);box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--live)}
.now .lbl{align-self:flex-start;font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:13px;letter-spacing:.05em;background:var(--accent);color:#fff;padding:3px 10px;border-radius:5px;transform:rotate(-2deg)}
.now.soon .lbl{background:var(--navy)}
.now.live .lbl{background:#fff;color:var(--live)}
.now .what{font-size:19px;font-weight:700}
.now .when{font-family:var(--font-display);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums;text-transform:uppercase}

h2{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0 0 10px;color:var(--title);text-transform:uppercase;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-family:var(--font-body);font-size:14px;font-weight:700;color:var(--accent);text-transform:none}
.list{display:flex;flex-direction:column;gap:10px}
.sep{align-self:flex-start;font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:14px;background:var(--soon);color:var(--title);padding:3px 10px;border-radius:5px;transform:rotate(-1.5deg);margin:8px 0 2px}

.ev{background:var(--surface);border:2px solid var(--line);border-left:7px solid var(--accent);border-radius:16px;padding:13px 14px;display:grid;grid-template-columns:72px 1fr;gap:4px 12px}
.ev .t{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1;color:var(--title);font-variant-numeric:tabular-nums}
.ev .t span{display:block;font-size:16px;color:var(--muted);margin-top:3px}
.ev .t.tbd{font-family:var(--font-body);font-weight:700;font-size:13px;color:var(--accent-dark);line-height:1.2}
.ev .body{display:flex;flex-direction:column;gap:5px;min-width:0}
.ev .name{font-weight:700;font-size:17px;color:var(--title)}
.ev .meta{color:var(--muted);font-size:14px}
.ev .note{font-size:14px}
.ev .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.pill{font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:12px;letter-spacing:.04em;padding:3px 9px;border-radius:5px;background:var(--accent);color:#fff;white-space:nowrap;transform:rotate(-2deg)}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dark)}
.warn{color:#9A6A00;font-weight:700}

.who{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.who .lab{color:var(--muted);font-weight:700}
.who .lab.missing{background:var(--soon);color:var(--title);padding:2px 8px;border-radius:5px}
.chip{font:inherit;font-size:13px;font-weight:700;padding:5px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--title);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.fixed{cursor:default;background:var(--accent-soft);border-color:transparent;color:var(--accent-dark)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.chip:disabled:not(.fixed){opacity:.5;cursor:not-allowed}

.ev.past{border-color:var(--past-soft);border-left-color:var(--past);background:var(--past-soft)}
.ev.past .pill{background:var(--past)}
.ev.live{border-color:var(--live-soft);border-left-color:var(--live);background:var(--live-soft)}
.ev.live .pill{background:var(--live)}
.ev.soon{border-color:var(--soon);border-left-color:var(--soon);background:var(--soon-soft)}
.ev.soon .pill{background:var(--soon);color:var(--title)}
.ev.open{border-left-color:var(--soon);border-left-style:dashed}
.ev.open .pill{background:var(--soon);color:var(--title)}
.ev.done{border-left-color:var(--done);opacity:.55}
.ev.done .name{text-decoration:line-through}
.ev.done .pill{background:var(--done)}
@media (prefers-reduced-motion: no-preference){
  .ev.soon{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 5px var(--soon-soft)}}
}

.btn{font:inherit;font-size:13px;font-weight:700;padding:6px 11px;border-radius:10px;border:2px solid var(--accent);background:var(--surface);color:var(--accent-dark);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--accent-soft)}
.btn.on{background:var(--done);color:#fff;border-color:var(--done)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.big{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:.03em;font-size:16px;padding:12px 16px;background:var(--navy);color:#fff;border-color:var(--navy);border-radius:10px}

.cta{position:sticky;top:10px;z-index:5;display:flex;align-items:center;gap:14px;width:100%;padding:12px 18px;border-radius:16px;background:var(--accent);color:#fff;text-decoration:none;font-family:var(--font-display);font-weight:400;text-transform:uppercase;font-size:24px;letter-spacing:.02em;line-height:1.05;border:3px solid var(--navy);box-shadow:0 6px 0 var(--navy),0 10px 24px rgba(31,90,116,.25)}
.cta-unused small{display:block;font-family:var(--font-body);font-weight:700;text-transform:none;font-size:13px;letter-spacing:0;opacity:.95;margin-top:3px}
.cta .plus{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--soon);color:var(--navy);font-size:32px;line-height:1}
.cta:hover{background:var(--accent-dark)}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
.cta:focus-visible{outline:3px solid var(--soon);outline-offset:3px}
@media (max-width:400px){.ev{grid-template-columns:60px 1fr}.ev .t{font-size:22px}h1{font-size:36px}}

.ev .t{appearance:none;border:0;background:none;padding:0;text-align:left;cursor:pointer;align-self:start}
.ev .t:disabled{cursor:default}
.ev .t.tbd{font-family:var(--font-body);font-weight:700;font-size:14px;color:var(--accent-dark);border:2px dashed var(--accent);border-radius:10px;padding:6px 4px;text-align:center}
.ev .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.ev .pill{flex:none;margin-top:2px}
.warn{font-size:13px;font-weight:700;color:#9A4A00;background:var(--soon-soft);border-radius:6px;padding:2px 8px;align-self:flex-start}
.who .missing{font-size:12px;font-weight:700;color:var(--title);background:var(--soon);padding:2px 8px;border-radius:5px}
.edit{display:flex;flex-direction:column;gap:10px;background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:4px}
.edit label{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--title)}
.edit input[type=time]{font:inherit;font-size:18px;font-weight:700;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--title);min-width:120px}
.seg{display:flex;gap:6px}
.segb{font:inherit;font-weight:700;font-size:14px;flex:1;padding:8px;border-radius:10px;border:2px solid var(--accent);background:#fff;color:var(--accent-dark);cursor:pointer}
.segb.on{background:var(--accent);color:#fff}
.erow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn.solid{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.notes{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.notes textarea{font:inherit;font-size:15px;width:100%;border:2px solid var(--accent);border-radius:12px;padding:10px;background:#fff;color:var(--ink);resize:vertical}
.notes textarea:focus{outline:3px solid var(--soon);outline-offset:1px}
.unsaved{font-size:12px;font-weight:700;color:#9A4A00}
.saved-note{font-size:14px;background:var(--soon-soft);border-left:4px solid var(--soon);border-radius:6px;padding:6px 10px;white-space:pre-wrap}
.ev.done .notes, .ev.done .saved-note{opacity:1}
.ev.done{opacity:1}
.ev.done .name,.ev.done .t,.ev.done .note,.ev.done .who{opacity:.5}
.mode{font-size:12px;color:var(--muted);text-align:center}
.mode:empty{display:none}
.ev.wait{border-left-color:var(--muted);border-left-style:dotted}
.tel{align-self:flex-start;font-weight:700;font-size:15px;color:var(--accent-dark);text-decoration:none;border-bottom:2px solid var(--accent-soft)}
.addbtn{font:inherit;font-weight:700;font-size:16px;width:100%;padding:12px;border-radius:14px;border:2px dashed var(--accent);background:var(--surface);color:var(--accent-dark);cursor:pointer}
.addbtn:hover{background:var(--accent-soft)}
.addform{margin-top:0;border:2px solid var(--accent)}
.tin{font:inherit;font-size:16px;font-weight:600;width:100%;padding:9px 12px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--title)}
.btn.del{border-color:var(--past);color:var(--past);margin-left:auto}
</style>

const PEOPLE = {19:["Ricky"], 20:["Otto","Ricky","Marti"]};
const DAYS = {19:"Giovedì 19", 20:"Venerdì 20"};
const SOON_MIN = 15;
const LS_KEY = "lc26-state";

// ---------- stato ----------
let EMBED = {rev:0, events:[]};
try{ EMBED = JSON.parse(document.getElementById("state").textContent); }catch(_){}
let STATE = JSON.parse(JSON.stringify(EMBED));
let MODE = "loading";            // "shared" (claude.ai) | "local" (GitHub/altro) | "readonly"
let artifactApi = null, dict = null, publishTimer = null, publishing = false;
const openEdit = new Set(), openNote = new Set(), editDay = {};
let addOpen = false, addDay = 20, armDel = null;

function loadLocal(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY)||"null"); }catch(_){}
  if(!saved || !Array.isArray(saved.events)) return;
  if((saved.rev||0) >= (EMBED.rev||0)){ STATE = saved; return; }
  // programma nuovo pubblicato: tiene orari nuovi, conserva fatto/chi/note locali
  const byId = Object.fromEntries(saved.events.map(e=>[e.id,e]));
  STATE.events.forEach(e=>{ const o = byId[e.id]; if(o){ e.done=o.done; e.notes=o.notes||e.notes; if(o.who && o.who.length) e.who=o.who; if(!e.day && o.day){ e.day=o.day; e.start=o.start; e.end=o.end; } } });
  saveLocal();
}
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(_){} }
function draftKey(id){ return "lc26-draft-"+id; }
function getDraft(id){ try{ return localStorage.getItem(draftKey(id)); }catch(_){ return null; } }
function setDraft(id,v){ try{ v==null?localStorage.removeItem(draftKey(id)):localStorage.setItem(draftKey(id),v); }catch(_){} }

// ---------- tempo ----------
const pad = n => String(n).padStart(2,"0");
const at = (day, hhmm) => new Date(`2026-11-${pad(day)}T${hhmm}:00+01:00`);
const startOf = e => at(e.day, e.start);
const endOf = e => e.end ? at(e.day,e.end) : new Date(startOf(e).getTime()+30*60000);
const fmt = d => d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Rome"});
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ev = id => STATE.events.find(e=>e.id===id);
const whoOf = e => e.day===19 ? PEOPLE[19] : (e.who||[]);
const canEdit = () => MODE==="shared" || MODE==="local";

function status(e, now){
  if(e.done) return "done";
  if(!e.day) return "wait";
  if(!e.start) return now > at(e.day,"23:59") ? "past" : "open";
  if(now >= endOf(e)) return "past";
  if(now >= startOf(e)) return "live";
  if(startOf(e) - now <= SOON_MIN*60000) return "soon";
  return "next";
}
function overlaps(e){
  if(!e.day || !e.start || e.done) return [];
  return STATE.events.filter(o=>o!==e && o.day===e.day && o.start && !o.done && startOf(o)<endOf(e) && startOf(e)<endOf(o)).map(o=>o.name.split(" – ")[0]);
}

// ---------- vista ----------
function cardHTML(e, now){
  const st = status(e, now);
  let pill = {done:"Fatto",past:"Passato",live:"In corso",soon:"Tra poco",next:"",open:"",wait:""}[st];
  if(st==="soon") pill = "Tra "+Math.max(1,Math.ceil((startOf(e)-now)/60000))+" min";
  const dis = canEdit() ? "" : "disabled";
  const ov = overlaps(e);
  const time = !e.day ? `<button class="t tbd" type="button" data-edit="${e.id}" ${dis}>Fissa</button>` : e.start ? `<button class="t" type="button" data-edit="${e.id}" ${dis} aria-label="Modifica orario">${e.start}${e.end?`<span>${e.end}</span>`:""}</button>`
                       : `<button class="t tbd" type="button" data-edit="${e.id}" ${dis}>+ orario</button>`;
  const owner = !e.day && (e.who||[]).length ? `<div class="who"><span class="chip fixed">→ ${esc(e.who.join(", "))}</span></div>` : "";
  const phone = e.phone ? `<a class="tel" href="tel:+39${e.phone.replace(/\D/g,"")}">${esc(e.phone.replace(/^(\d{3})(\d{3})(\d+)$/,"$1 $2 $3"))}</a>` : "";
  const selDay = editDay[e.id] ?? (e.day||"wait");
  const who = e.day===20 ? `<div class="who">${PEOPLE[20].map(p=>`<button type="button" class="chip ${(e.who||[]).includes(p)?"on":""}" data-who="${p}" data-id="${e.id}" aria-pressed="${(e.who||[]).includes(p)}" ${dis}>${p}</button>`).join("")}${(e.who||[]).length?"":`<span class="missing">chi va?</span>`}</div>` : "";
  const edit = openEdit.has(e.id) ? `<form class="edit" data-form="${e.id}">
      <div class="seg" role="group" aria-label="Giorno">${[19,20,"wait"].map(d=>`<button type="button" class="segb ${selDay===d?"on":""}" data-setday="${d}" data-id="${e.id}">${d===19?"Gio 19":d===20?"Ven 20":"In attesa"}</button>`).join("")}</div>
      <input class="tin" type="text" id="nm-${e.id}" value="${esc(e.name)}" aria-label="Nome">
      <label>Dalle <input type="time" id="s-${e.id}" value="${e.start||""}" step="300"></label>
      <label>Alle <input type="time" id="e-${e.id}" value="${e.end||""}" step="300"></label>
      <div class="erow"><button class="btn solid" type="submit">Salva</button><button class="btn" type="button" data-clear="${e.id}">Senza orario</button><button class="btn ghost" type="button" data-edit="${e.id}">Annulla</button><button class="btn del" type="button" data-del="${e.id}">${armDel===e.id?"Conferma elimina":"Elimina"}</button></div>
    </form>` : "";
  const draft = getDraft(e.id);
  const noteOpen = e.done || openNote.has(e.id);
  const notes = noteOpen ? `<div class="notes">
      <textarea id="n-${e.id}" data-note="${e.id}" rows="3" placeholder="Note e cose da fare…" ${dis}>${esc(draft!=null?draft:(e.notes||""))}</textarea>
      <div class="erow">${dict||window.webkitSpeechRecognition||window.SpeechRecognition?`<button class="btn mic" type="button" data-mic="${e.id}" ${dis}>🎤 Detta</button>`:""}<button class="btn solid" type="button" data-savenote="${e.id}" ${dis}>Salva nota</button>${draft!=null && draft!==(e.notes||"")?`<span class="unsaved">non salvata</span>`:""}</div>
    </div>` : (e.notes ? `<div class="saved-note">${esc(e.notes)}</div>` : "");
  return `<article class="ev ${st}" id="card-${e.id}">
    ${time}
    <div class="body">
      <div class="top"><div class="name">${esc(e.name)}</div>${pill?`<span class="pill">${pill}</span>`:""}</div>
      ${e.note?`<div class="note">${esc(e.note)}</div>`:""}
      ${ov.length?`<div class="warn">Si accavalla con ${esc(ov.join(", "))}</div>`:""}
      ${phone}
      ${owner}${who}
      ${edit}
      <div class="row">
        <button class="btn ${e.done?"on":""}" type="button" data-done="${e.id}" ${dis}>${e.done?"✓ Fatto":"Segna fatto"}</button>
        ${!e.done && !openNote.has(e.id)?`<button class="btn ghost" type="button" data-opennote="${e.id}" ${dis}>Nota</button>`:""}
      </div>
      ${notes}
    </div>
  </article>`;
}

function dayHTML(d, now){
  const list = STATE.events.filter(e=>e.day===d);
  const timed = list.filter(e=>e.start).sort((a,b)=>startOf(a)-startOf(b));
  const tbd = list.filter(e=>!e.start);
  return timed.map(e=>cardHTML(e,now)).join("") + (tbd.length?`<div class="sep">Da fissare</div>`+tbd.map(e=>cardHTML(e,now)).join(""):"");
}

  <section><h2>Venerdì 20 <small>Otto · Ricky · Marti</small></h2><div class="list" id="day-20"></div></section>
  <section><h2>In attesa <small>di riscontro</small></h2><div class="list" id="day-wait"></div></section>
  <div class="mode" id="mode"></div>
</div>`);
}

function render(){
  const now = new Date();
  // non ridisegnare mentre si scrive una nota
  const a = document.activeElement;
  if(a && (a.tagName==="TEXTAREA" || a.tagName==="INPUT")){ renderNow(now); return; }
  [19,20].forEach(d=>{ document.getElementById("day-"+d).innerHTML = dayHTML(d, now); });
  document.getElementById("add").innerHTML = addHTML();
  document.getElementById("day-wait").innerHTML = STATE.events.filter(e=>!e.day).map(e=>cardHTML(e,now)).join("");
  renderNow(now);
  document.getElementById("mode").textContent = MODE==="local" ? "Modifiche salvate solo su questo telefono." : MODE==="readonly" ? "Solo lettura." : "";
}
function renderNow(now){
  const box=document.getElementById("now"), lbl=document.getElementById("nowLbl"), what=document.getElementById("nowWhat"), when=document.getElementById("nowWhen");
  box.className="now";
  const timed = STATE.events.filter(e=>e.start && !e.done);
  const live = timed.find(e=>status(e,now)==="live");
  const nxt = timed.filter(e=>startOf(e)>now).sort((a,b)=>startOf(a)-startOf(b))[0];
  const w = e => whoOf(e).length ? " · "+whoOf(e).join(", ") : "";
  if(live){
    box.classList.add("live"); lbl.textContent="In corso";
    what.textContent = live.name+w(live);
    when.textContent = "fino alle "+fmt(endOf(live))+(nxt?` · poi ${nxt.start}`:"");
  } else if(nxt){
    const mins = Math.ceil((startOf(nxt)-now)/60000);
    if(mins<=SOON_MIN){ box.classList.add("soon"); lbl.textContent="Tra "+mins+" min"; } else lbl.textContent="Prossimo";
    what.textContent = nxt.name+w(nxt);
    const rel = mins<60 ? mins+" min" : mins<1440 ? Math.floor(mins/60)+" h "+pad(mins%60) : Math.floor(mins/1440)+" g "+Math.floor((mins%1440)/60)+" h";
    when.textContent = (nxt.day===19?"Gio ":"Ven ")+nxt.start+" · tra "+rel;
  } else { lbl.textContent="Programma"; what.textContent="Nessun appuntamento con orario in arrivo"; when.textContent=""; }
}
function setBanner(t){ const b=document.getElementById("banner"); if(b) b.textContent=t||""; }

// ---------- salvataggio ----------
function buildDoc(){
  const json = JSON.stringify(STATE).replace(/</g,"\\u003c");
  return `<!DOCTYPE html>\n<html lang="it">\n<head>${HEAD_SRC}<style>${STYLE_SRC}</style>\n</head>\n<body>\n<script type="application/json" id="state">${json}<\/script>\n<script>${SELF_SRC}<\/script>\n</body>\n</html>\n`;
}
function commit(now){
  if(MODE==="local"){ saveLocal(); render(); return; }
  if(MODE!=="shared") return;
  render(); setBanner("Salvataggio…");
  clearTimeout(publishTimer);
  publishTimer = setTimeout(async ()=>{
    if(publishing) return; publishing = true;
    try{ await artifactApi.publish(buildDoc()); setBanner(""); }
    catch(err){
      const code = String((err && (err.code||err.message)) || "");
      if(/not_granted|not_writer/.test(code)){ MODE="readonly"; setBanner("Solo lettura: serve l'accesso in modifica."); render(); }
      else if(/conflict/.test(code)) setBanner("Qualcuno ha appena salvato: riprova.");
      else setBanner("Salvataggio non riuscito, riprova.");
    } finally { publishing = false; }
  }, now ? 0 : 600);
}

// ---------- azioni ----------
document.addEventListener("click", evt=>{
  const t = evt.target.closest("button");
  if(!t || t.disabled) return;
  const d = t.dataset;
  if(d.done){ const e=ev(d.done); e.done=!e.done; commit(); return; }
  if(d.who){ const e=ev(d.id); const s=new Set(e.who||[]); s.has(d.who)?s.delete(d.who):s.add(d.who); e.who=PEOPLE[20].filter(p=>s.has(p)); commit(); return; }
  if(d.edit){ openEdit.has(d.edit)?openEdit.delete(d.edit):openEdit.add(d.edit); render(); return; }
  if(d.setday){ editDay[d.id]= d.setday==="wait" ? "wait" : +d.setday; render(); return; }
  if(d.del){ if(armDel!==d.del){ armDel=d.del; render(); return; } STATE.events=STATE.events.filter(x=>x.id!==d.del); armDel=null; openEdit.delete(d.del); commit(); return; }
  if(d.add){ addOpen=!addOpen; render(); if(addOpen){ const n=document.getElementById("add-name"); if(n) n.focus(); } return; }
  if(d.addday){ addDay = d.addday==="wait" ? "wait" : +d.addday; const keep=collectAdd(); render(); restoreAdd(keep); return; }
  if(d.clear){ const e=ev(d.clear); if(!applyDay(e)) return; e.start=null; e.end=null; openEdit.delete(e.id); commit(); return; }
  if(d.opennote){ openNote.add(d.opennote); render(); const ta=document.getElementById("n-"+d.opennote); if(ta) ta.focus(); return; }
  if(d.savenote){ saveNote(d.savenote); return; }
  if(d.mic){ toggleMic(d.mic, t); return; }
});
document.addEventListener("submit", evt=>{
  if(evt.target.id==="addForm"){
    evt.preventDefault();
    const [name,s,en,note] = collectAdd();
    if(!name.trim()){ setBanner("Scrivi chi o cosa."); return; }
    if(en && s && en<=s){ setBanner("L'orario di fine deve essere dopo l'inizio."); return; }
    const day = addDay==="wait" ? null : addDay;
    STATE.events.push({id:"m"+Date.now().toString(36), name:name.trim(), day, start: day&&s?s:null, end: day&&s&&en?en:null, type:"", note:note.trim(), who:[], done:false, notes:"", phone:""});
    addOpen=false; setBanner(""); document.activeElement && document.activeElement.blur(); commit(); return;
  }
  const f = evt.target.closest("[data-form]"); if(!f) return;
  evt.preventDefault();
  const e = ev(f.dataset.form);
  const s = document.getElementById("s-"+e.id).value, en = document.getElementById("e-"+e.id).value;
  if(!s){ setBanner("Metti almeno l'orario di inizio, oppure tocca \"Senza orario\"."); return; }
  if(en && en<=s){ setBanner("L'orario di fine deve essere dopo l'inizio."); return; }
  if(!applyDay(e)) return;
  e.start=s; e.end=en||null; openEdit.delete(e.id); setBanner(""); document.activeElement && document.activeElement.blur(); commit();
});
document.addEventListener("input", evt=>{
  const ta = evt.target.closest("[data-note]"); if(ta) setDraft(ta.dataset.note, ta.value);
});
function applyDay(e){
  const d = editDay[e.id] ?? (e.day||"wait");
  const nm = document.getElementById("nm-"+e.id);
  if(nm && nm.value.trim()) e.name = nm.value.trim();
  if(d==="wait"){ e.day=null; e.start=null; e.end=null; }
  else if(d!==e.day){ e.day=d; if(d===19) e.who=[]; }
  delete editDay[e.id]; return true;
}
function collectAdd(){ return ["add-name","add-s","add-e","add-note"].map(id=>{ const x=document.getElementById(id); return x?x.value:""; }); }
function restoreAdd(v){ ["add-name","add-s","add-e","add-note"].forEach((id,i)=>{ const x=document.getElementById(id); if(x) x.value=v[i]||""; }); }
function addHTML(){
  if(!canEdit()) return "";
  if(!addOpen) return `<button class="addbtn" type="button" data-add="1">+ Aggiungi appuntamento</button>`;
  const wait = addDay==="wait";
  return `<form class="edit addform" id="addForm">
    <input class="tin" type="text" id="add-name" placeholder="Chi / cosa" required>
    <div class="seg" role="group" aria-label="Giorno">${[19,20,"wait"].map(d=>`<button type="button" class="segb ${addDay===d?"on":""}" data-addday="${d}">${d===19?"Gio 19":d===20?"Ven 20":"In attesa"}</button>`).join("")}</div>
    ${wait?"":`<label>Dalle <input type="time" id="add-s" step="300"></label><label>Alle <input type="time" id="add-e" step="300"></label>`}
    <input class="tin" type="text" id="add-note" placeholder="Nota (facoltativa)">
    <div class="erow"><button class="btn solid" type="submit">Aggiungi</button><button class="btn ghost" type="button" data-add="1">Annulla</button></div>
  </form>`;
}
function saveNote(id){
  const ta = document.getElementById("n-"+id); if(!ta) return;
  const e = ev(id); e.notes = ta.value.trim(); setDraft(id, null); openNote.delete(id);
  ta.blur(); commit(true);
}

// ---------- dettatura ----------
let rec = null, recId = null;
function toggleMic(id, btn){
  const ta = document.getElementById("n-"+id);
  const append = txt => { ta.value = (ta.value ? ta.value.replace(/\s+$/,"")+" " : "") + txt.trim(); setDraft(id, ta.value); };
  if(dict){
    if(dict.active()){ dict.stop(); return; }
    recId = id;
    dict.start({language:"it-IT"}).catch(err=>{ setBanner(err && err.code==="not_granted" ? "Dettatura non permessa: usa il microfono della tastiera." : "Dettatura non disponibile, usa il microfono della tastiera."); });
    btn.textContent = "■ Stop";
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  if(rec){ rec.stop(); return; }
  rec = new SR(); rec.lang="it-IT"; rec.interimResults=false; rec.continuous=true; recId=id;
  rec.onresult = r => { for(let i=r.resultIndex;i<r.results.length;i++) if(r.results[i].isFinal){ const t=document.getElementById("n-"+recId); if(t){ t.value=(t.value?t.value.replace(/\s+$/,"")+" ":"")+r.results[i][0].transcript.trim(); setDraft(recId,t.value);} } };
  rec.onend = () => { rec=null; const b=document.querySelector(`[data-mic="${id}"]`); if(b) b.textContent="🎤 Detta"; };
  rec.onerror = () => setBanner("Dettatura non riuscita: usa il microfono della tastiera.");
  try{ rec.start(); btn.textContent="■ Stop"; }catch(_){ rec=null; }
}

// ---------- avvio ----------
shell();
if(!(window.claude && typeof window.claude.use==="function")){ MODE="local"; loadLocal(); }
render();
setInterval(render, 30000);
if(MODE!=="local"){
  window.claude.use("artifact").then(a=>{ artifactApi=a; MODE = a ? "shared" : "readonly"; render(); }).catch(()=>{ MODE="readonly"; render(); });
  window.claude.use("dictation").then(d=>{
    dict=d; if(!d) return;
    d.onFinal(({text})=>{ const t=document.getElementById("n-"+recId); if(t){ t.value=(t.value?t.value.replace(/\s+$/,"")+" ":"")+text.trim(); setDraft(recId,t.value);} });
    d.onState(({state})=>{ const b=document.querySelector(`[data-mic="${recId}"]`); if(b) b.textContent = state==="idle" ? "🎤 Detta" : "■ Stop"; });
    render();
  }).catch(()=>{});
}
</script>
